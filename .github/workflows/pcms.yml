name: PCMS environment

on:
  push:
    branches: [main]
    paths: &paths
    - environments/pcms/**
    - environments/pcms-cuda/**
    - environments/pcms-rocm/**
    - spack_repo/scorec/repo.yaml
    - spack_repo/scorec/packages/pcms/**
    - spack_repo/scorec/packages/redev/**
    - spack_repo/scorec/packages/meshfields/**
    - spack_repo/scorec/packages/omega_h/**
    - .github/workflows/pcms.yml
    - .github/workflows/build-spack-env.yml
  pull_request:
    paths: *paths
  schedule:
  # Weekly rebuild to pick up new commits on tracked branches and keep the
  # build cache warm for downstream CI.
  - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  # date for the dated image tags 
  image-date:
    runs-on: ubuntu-24.04
    outputs:
      date: ${{ steps.date.outputs.date }}
    steps:
    - id: date
      run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

  build:
    needs: image-date
    uses: ./.github/workflows/build-spack-env.yml
    with:
      environment: pcms
      target: x86_64_v3
      tests: true
      image-spec: pcms+python+petsc
      image-tag: pcms-develop-amd64
      image-date: ${{ needs.image-date.outputs.date }}

  build-arm:
    needs: image-date
    uses: ./.github/workflows/build-spack-env.yml
    with:
      environment: pcms
      runner: ubuntu-24.04-arm
      # Should work on runners (Neoverse N2) and on Apple silicon.
      target: armv8.2a
      tests: true
      image-spec: pcms+python+petsc
      image-tag: pcms-develop-arm64
      image-date: ${{ needs.image-date.outputs.date }}

  # Compile-only: hosted runners have no GPU, so no tests. The container
  # provides nvcc; compiling for cuda_arch=75 needs no device.
  build-cuda:
    uses: ./.github/workflows/build-spack-env.yml
    with:
      environment: pcms-cuda
      container: nvidia/cuda:12.6.3-devel-ubuntu24.04
      base-image: nvidia/cuda:12.6.3-devel-ubuntu24.04

  # Compile-only for Frontier's MI250X (gfx90a) with Frontier's ROCm version.
  build-rocm:
    uses: ./.github/workflows/build-spack-env.yml
    with:
      environment: pcms-rocm
      container: rocm/dev-ubuntu-24.04:6.4.2
      base-image: rocm/dev-ubuntu-24.04:6.4.2

  # Combines the per-architecture images under pcms-develop, also published as
  # ghcr.io/scorec/pcms:develop, the name the pcms README documents.
  publish-image:
    needs: [image-date, build, build-arm]
    if: ${{ !cancelled() && (needs.build.outputs.image != '' || needs.build-arm.outputs.image != '') }}
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
    - name: Log in to GHCR
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

    - name: Tag multi-architecture image
      id: publish
      env:
        REPO: ghcr.io/scorec/scorec-spack-buildcache
        PUBLIC: ghcr.io/scorec/pcms
        DATE: ${{ needs.image-date.outputs.date }}
        BUILT: ${{ needs.build.outputs.image }} ${{ needs.build-arm.outputs.image }}
      run: |
        docker buildx imagetools create \
          -t "$REPO:pcms-develop-$DATE" -t "$PUBLIC:develop-$DATE" $BUILT
        latest=()
        for arch in amd64 arm64; do
          if docker buildx imagetools inspect "$REPO:pcms-develop-$arch" >/dev/null 2>&1; then
            latest+=("$REPO:pcms-develop-$arch")
          fi
        done
        docker buildx imagetools create \
          -t "$REPO:pcms-develop" -t "$PUBLIC:develop" "${latest[@]}"
        echo "image=$PUBLIC:develop-$DATE" >> "$GITHUB_OUTPUT"
        {
          echo "Built this run: $BUILT"
          echo
          echo "pcms-develop combines: ${latest[*]}"
        } >> "$GITHUB_STEP_SUMMARY"

  # Checks the published image runs on a base image
  test-container:
    needs: publish-image
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Runimage
      env:
        IMAGE: ${{ needs.publish-image.outputs.image }}
      run: |
        docker pull "$IMAGE"
        docker run --rm "$IMAGE" python3 -c "import pcms"
        docker run --rm \
          -e OMPI_ALLOW_RUN_AS_ROOT=1 -e OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1 \
          -e OMPI_MCA_rmaps_base_oversubscribe=1 \
          "$IMAGE" mpirun -n 2 python3 -c "import pcms"
